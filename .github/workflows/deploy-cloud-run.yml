name: CI/CD - Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: my-portfolio-492519
  GCP_REGION: us-central1
  SERVICE: studymate-nau

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet and test backend
        working-directory: backend
        run: |
          go vet ./...
          go test ./...

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT_EMAIL != '' }}
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          export_environment_variables: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Authenticate to Google Cloud with JSON key
        if: ${{ (env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT_EMAIL == '') && env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          export_environment_variables: true
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Activate Google Cloud credentials
        run: |
          if [[ -z "${GOOGLE_GHA_CREDS_PATH:-}" ]]; then
            echo "No Google Cloud credentials were configured. Set either Workload Identity secrets or GCP_SA_KEY."
            exit 1
          fi

          gcloud auth login --cred-file="$GOOGLE_GHA_CREDS_PATH" --quiet
          gcloud config set project "$GCP_PROJECT"

      # the gemini key lives on the cloud run service itself, redeploys keep it
      # the service was first built without a dockerfile, gcloud won't build from ours until that old base image is cleared
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --clear-base-image \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --update-env-vars FIREBASE_PROJECT_ID=my-portfolio-492519 \
            --memory 512Mi \
            --timeout 300 \
            --max-instances 3 \
            --quiet
